
name: Build PADMA RMS Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check required files
        shell: pwsh
        run: |
          if (!(Test-Path "www/index.html")) {
            throw "www/index.html is missing"
          }
          if (!(Test-Path "padma.ico")) {
            throw "padma.ico is missing"
          }

      - name: Prepare Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-app | Out-Null
          Copy-Item -Path "www/*" -Destination "windows-app/" -Recurse -Force
          Copy-Item "padma.ico" "windows-app/padma.ico" -Force

      - name: Create Electron package
        shell: pwsh
        run: |
          @'
          {
            "name": "padma-rms",
            "version": "1.0.0",
            "private": true,
            "description": "PADMA RMS Offline Retail Management",
            "main": "main.cjs",
            "scripts": {
              "dist": "electron-builder --win nsis --x64"
            },
            "devDependencies": {
              "electron": "latest",
              "electron-builder": "latest"
            },
            "build": {
              "appId": "com.padma.rms",
              "productName": "PADMA RMS",
              "directories": {
                "output": "dist"
              },
              "files": [
                "**/*",
                "!dist/**"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": ["x64"]
                  }
                ],
                "icon": "padma.ico",
                "artifactName": "PADMA-RMS-Setup-${version}.${ext}"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "PADMA RMS"
              }
            }
          }
          '@ | Set-Content -Path windows-app/package.json -Encoding UTF8

      - name: Create Electron main process
        shell: pwsh
        run: |
          @'
          const {
            app,
            BrowserWindow,
            ipcMain,
            shell
          } = require("electron");

          const path = require("path");

          const preloadPath = path.join(__dirname, "preload.cjs");

          function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              autoHideMenuBar: true,
              webPreferences: {
                preload: preloadPath,
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true
              }
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url === "about:blank") {
                return {
                  action: "allow",
                  overrideBrowserWindowOptions: {
                    width: 900,
                    height: 800,
                    autoHideMenuBar: true,
                    webPreferences: {
                      preload: preloadPath,
                      nodeIntegration: false,
                      contextIsolation: true,
                      sandbox: true
                    }
                  }
                };
              }

              if (url.startsWith("https://") ||
                  url.startsWith("http://")) {
                shell.openExternal(url);
              }

              return { action: "deny" };
            });

            win.loadFile(path.join(__dirname, "index.html"));
          }

          // Print silently using the Windows default printer.
          ipcMain.handle("padma:silent-print", async (event) => {
            return new Promise((resolve) => {
              const contents = event.sender;

              if (contents.isDestroyed()) {
                resolve({
                  success: false,
                  error: "Print window is unavailable"
                });
                return;
              }

              contents.print(
                {
                  silent: true,
                  printBackground: true
                },
                (success, failureReason) => {
                  resolve({
                    success,
                    error: success ? null : failureReason
                  });
                }
              );
            });
          });

          app.whenReady().then(createWindow);

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") app.quit();
          });

          app.on("activate", () => {
            if (BrowserWindow.getAllWindows().length === 0) {
              createWindow();
            }
          });
          '@ | Set-Content -Path windows-app/main.cjs -Encoding UTF8

      - name: Create silent printing preload
        shell: pwsh
        run: |
          @'
          const { contextBridge, ipcRenderer } = require("electron");

          contextBridge.exposeInMainWorld("padmaPrint", {
            print: () => ipcRenderer.invoke("padma:silent-print")
          });

          // Install print override in the page's main JavaScript world.
          window.addEventListener("DOMContentLoaded", () => {
            const script = document.createElement("script");

            script.textContent = `
              window.print = function() {
                if (window.padmaPrint) {
                  window.padmaPrint.print().then(result => {
                    if (!result || !result.success) {
                      console.error(
                        "PADMA silent printing failed:",
                        result && result.error
                      );
                    }
                  });
                }
              };
            `;

            (document.documentElement || document.head)
              .appendChild(script);

            script.remove();
          });
          '@ | Set-Content -Path windows-app/preload.cjs -Encoding UTF8

      - name: Install Electron dependencies
        working-directory: windows-app
        run: npm install

      - name: Build PADMA RMS Windows EXE
        working-directory: windows-app
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PADMA-RMS-Windows-EXE
          path: windows-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14
