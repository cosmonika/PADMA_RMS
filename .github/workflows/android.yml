
name: Build PADMA RMS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Install dependencies
        run: npm install

      - name: Check required files
        run: |
          test -f www/index.html
          test -f padma.png
          test -f google-services.json
          test -f src/push-notifications.js

      - name: Prepare PADMA logo
        run: |
          mkdir -p www
          cp padma.png www/padma.png

      - name: Build push notifications
        run: npm run build:push

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          import json
          with open("google-services.json") as f:
              data = json.load(f)
          package = data["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package != "com.padma.rms":
              raise SystemExit(f"Wrong Firebase package: {package}")
          print("Firebase package verified:", package)
          PY

      - name: Generate PADMA icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Configure Android App Links
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()

          activity = None
          for item in root.findall(".//activity"):
              name = item.get(android + "name", "")
              if name.endswith("MainActivity"):
                  activity = item
                  break

          if activity is None:
              raise SystemExit("MainActivity not found")

          intent = ET.SubElement(activity, "intent-filter")
          intent.set(android + "autoVerify", "true")
          ET.SubElement(intent, "action", {
              android + "name": "android.intent.action.VIEW"
          })
          ET.SubElement(intent, "category", {
              android + "name": "android.intent.category.DEFAULT"
          })
          ET.SubElement(intent, "category", {
              android + "name": "android.intent.category.BROWSABLE"
          })
          ET.SubElement(intent, "data", {
              android + "scheme": "https",
              android + "host": "padma.cosmonika.com"
          })

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configure Android screen bars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("android/app/src/main/java")
          matches = list(base.rglob("MainActivity.java"))
          if not matches:
              raise SystemExit("MainActivity.java not found")

          path = matches[0]
          package = "com.padma.rms"

          source = f'''package {package};

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.content.Context;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(android.graphics.Color.BLACK);
                  getWindow().setNavigationBarColor(android.graphics.Color.BLACK);

                  getBridge().getWebView().addJavascriptInterface(
                      new Object() {{
                          @JavascriptInterface
                          public void print(String html) {{
                              runOnUiThread(() -> {{
                                  WebView printView = new WebView(MainActivity.this);
                                  printView.setWebViewClient(new WebViewClient() {{
                                      @Override
                                      public void onPageFinished(WebView view, String url) {{
                                          PrintManager manager = (PrintManager)
                                              getSystemService(Context.PRINT_SERVICE);
                                          PrintDocumentAdapter adapter =
                                              view.createPrintDocumentAdapter("PADMA RMS Bill");
                                          manager.print("PADMA RMS Bill", adapter,
                                              new android.print.PrintAttributes.Builder().build());
                                      }}
                                  }});
                                  printView.loadDataWithBaseURL(
                                      null, html, "text/html", "UTF-8", null
                                  );
                              }});
                          }}
                      }},
                      "PadmaNativePrint"
                  );
              }}
          }}
          '''
          path.write_text(source)
          print("Configured:", path)
          PY

      - name: Configure Android SDK target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle")
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'targetSdkVersion\s*=\s*\d+',
                            'targetSdkVersion = 34', text)
              text = re.sub(r'targetSdkVersion\s+\d+',
                            'targetSdkVersion 34', text)
              path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload PADMA RMS APK
        uses: actions/upload-artifact@v4
        with:
          name: PADMA-RMS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
