name: Build PADMA RMS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get project files
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Python image library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Install project dependencies
        run: npm install

      - name: Check required files
        run: |
          test -f www/index.html
          test -f padma.png
          test -f src/push-notifications.js
          echo "PADMA RMS files found."

      - name: Prepare app icon and splash screen
        run: |
          mkdir -p assets www

          python3 - <<'PY'
          from PIL import Image

          image = Image.open("padma.png").convert("RGBA")
          icon = Image.new("RGBA", (1024, 1024), (255, 255, 255, 0))
          image.thumbnail((900, 900))
          x = (1024 - image.width) // 2
          y = (1024 - image.height) // 2
          icon.alpha_composite(image, (x, y))
          icon.save("assets/icon.png")

          logo = Image.open("padma.png").convert("RGBA")
          logo.thumbnail((1200, 1200))
          splash = Image.new("RGBA", (2732, 2732), "white")
          x = (2732 - logo.width) // 2
          y = (2732 - logo.height) // 2
          splash.alpha_composite(logo, (x, y))
          splash.convert("RGB").save("assets/splash.png")
          PY

          cp padma.png www/padma.png

      - name: Build push notification JavaScript
        run: npm run build:push

      - name: Verify notification bundle
        run: |
          test -f www/padma-push.js
          echo "Notification bundle OK: $(wc -c < www/padma-push.js) bytes"

      # IMPORTANT: create android BEFORE touching any native files
      - name: Create Android project
        run: npx cap add android

      - name: Inject notification loader into www/index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          if "padma-push.js" in html:
              print("Notification loader already present.")
          else:
              if "</body>" in html:
                  html = html.replace("</body>", '<script defer src="padma-push.js"></script>\n</body>', 1)
                  p.write_text(html, encoding="utf-8")
                  print("Notification loader injected.")
              else:
                  raise SystemExit("ERROR: </body> not found in www/index.html")
          PY

      - name: Set up permanent Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ -f padma-debug.keystore ]; then
            echo "Using committed permanent PADMA signing key."
          else
            echo "Generating permanent PADMA signing key (first run only)."
            keytool -genkeypair \
              -v \
              -keystore padma-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            git config user.name "PADMA Bot"
            git config user.email "bot@padma.local"
            git add padma-debug.keystore
            git commit -m "Add permanent signing keystore [skip ci]"
            git push
          fi

          cp padma-debug.keystore "$HOME/.android/debug.keystore"

          FINGERPRINT=$(keytool -list -v \
            -keystore padma-debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android |
            grep SHA256: | head -1 | sed 's/.*SHA256: //')

          test -n "$FINGERPRINT" || { echo "Fingerprint failed"; exit 1; }

          echo "PADMA_APP_LINK_SHA256=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "## PADMA App Links SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # CRITICAL FIX: WRITE MainActivity *AFTER* cap add android, and use the
      # path Capacitor actually generated. Find the package dir dynamically.
      - name: Install native Android invoice printing
        shell: bash
        run: |
          set -e

          # Discover where Capacitor placed MainActivity.java
          EXISTING=$(find android/app/src/main/java -name MainActivity.java | head -1)
          if [ -z "$EXISTING" ]; then
            echo "ERROR: Capacitor did not generate MainActivity.java"
            exit 1
          fi
          echo "Capacitor generated: $EXISTING"

          PKG_DIR=$(dirname "$EXISTING")
          PKG_NAME=$(grep -m1 '^package ' "$EXISTING" | sed 's/package //;s/;//')
          echo "Package: $PKG_NAME"
          echo "Package dir: $PKG_DIR"

          if [ "$PKG_NAME" != "com.padma.rms" ]; then
            echo "WARNING: package is '$PKG_NAME', expected 'com.padma.rms'"
          fi

          # Replace only the Java body — keep the SAME package as Capacitor generated
          cat > "$EXISTING" <<JAVA
          package $PKG_NAME;

          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.BridgeActivity;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {

              private final List<WebView> printViews = new ArrayList<>();

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // super.onCreate MUST run first so bridge.getWebView() exists
                  super.onCreate(savedInstanceState);

                  WebView appWebView = this.bridge.getWebView();
                  if (appWebView == null) {
                      return;
                  }

                  appWebView.addJavascriptInterface(
                      new PadmaPrintBridge(this),
                      "PadmaNativePrint"
                  );

                  installPrintHook(appWebView, 0);
              }

              private void installPrintHook(WebView webView, int attempt) {
                  if (attempt >= 40) return;

                  String script =
                      "(function() {" +
                      " if (document.readyState !== 'complete') return;" +
                      " if (window.__padmaPrintHookInstalled) return;" +
                      " if (!window.PadmaNativePrint) return;" +
                      " window.__padmaPrintHookInstalled = true;" +
                      " window.open = function() {" +
                      "   var html = '';" +
                      "   var printed = false;" +
                      "   return {" +
                      "     document: {" +
                      "       write: function(content) { html += String(content); }," +
                      "       close: function() {}" +
                      "     }," +
                      "     print: function() {" +
                      "       if (printed || !html) return;" +
                      "       printed = true;" +
                      "       var match = html.match(/<title>([\\\\s\\\\S]*?)<\\\\/title>/i);" +
                      "       var title = match ? match[1] : 'PADMA Invoice';" +
                      "       window.PadmaNativePrint.printHtml(html, title);" +
                      "     }" +
                      "   };" +
                      " };" +
                      "})();";

                  webView.evaluateJavascript(script, null);

                  new Handler(Looper.getMainLooper()).postDelayed(
                      () -> installPrintHook(webView, attempt + 1),
                      300
                  );
              }

              private class PadmaPrintBridge {
                  private final Context context;
                  PadmaPrintBridge(Context context) { this.context = context; }

                  @JavascriptInterface
                  public void printHtml(String html, String title) {
                      if (html == null || html.isEmpty()) return;

                      new Handler(Looper.getMainLooper()).post(() -> {
                          WebView printWebView = new WebView(context);
                          printWebView.setBackgroundColor(Color.WHITE);
                          printWebView.getSettings().setJavaScriptEnabled(false);
                          printViews.add(printWebView);

                          printWebView.setWebViewClient(new WebViewClient() {
                              private boolean started = false;

                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  if (started) return;
                                  started = true;

                                  PrintManager printManager =
                                      (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (printManager == null) return;

                                  String safeTitle =
                                      (title == null || title.trim().isEmpty())
                                      ? "PADMA Invoice"
                                      : title.replaceAll("[^a-zA-Z0-9_-]", "_");

                                  android.print.PrintDocumentAdapter adapter =
                                      view.createPrintDocumentAdapter(safeTitle);

                                  PrintAttributes attributes =
                                      new PrintAttributes.Builder()
                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                          .setResolution(new PrintAttributes.Resolution(
                                              "padma", "PADMA RMS", 300, 300))
                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                          .build();

                                  printManager.print(safeTitle, adapter, attributes);
                              }
                          });

                          printWebView.loadDataWithBaseURL(
                              null, html, "text/html", "UTF-8", null
                          );
                      });
                  }
              }
          }
          JAVA

          echo "Native Android invoice printing installed at $EXISTING"

      - name: Generate Android icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          g = Path("android/variables.gradle")
          if g.exists():
              c = g.read_text()
              c2, n = re.subn(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', c)
              if n:
                  g.write_text(c2)
                  print("Target SDK configured.")
              else:
                  print("Default target SDK retained.")
          PY

      - name: Sync PADMA RMS plugins
        run: npx cap sync android

      - name: Configure PADMA RMS verified App Links
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Application element not found.")

          activity = None
          for item in app.findall("activity"):
              if item.get(android + "name", "").endswith("MainActivity"):
                  activity = item
                  break
          if activity is None:
              raise SystemExit("MainActivity not found in manifest.")

          for existing in list(activity.findall("intent-filter")):
              data = existing.find("data")
              if data is not None and data.get(android + "host") == "padma.cosmonika.com":
                  activity.remove(existing)

          intent = ET.SubElement(activity, "intent-filter")
          intent.set(android + "autoVerify", "true")

          a = ET.SubElement(intent, "action")
          a.set(android + "name", "android.intent.action.VIEW")

          c1 = ET.SubElement(intent, "category")
          c1.set(android + "name", "android.intent.category.DEFAULT")

          c2 = ET.SubElement(intent, "category")
          c2.set(android + "name", "android.intent.category.BROWSABLE")

          d = ET.SubElement(intent, "data")
          d.set(android + "scheme", "https")
          d.set(android + "host", "padma.cosmonika.com")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("App Links configured.")
          PY

      - name: Verify native printing code
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          test -f "$F"
          grep -q 'PadmaNativePrint' "$F"
          grep -q 'extends BridgeActivity' "$F"
          grep -q 'super.onCreate' "$F"
          echo "Java bridge OK at $F"

      - name: Verify App Links
        run: |
          grep -q 'padma.cosmonika.com' android/app/src/main/AndroidManifest.xml
          grep -q 'autoVerify' android/app/src/main/AndroidManifest.xml
          echo "App Links OK."

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PADMA-RMS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save permanent App Links signing key
        uses: actions/upload-artifact@v4
        with:
          name: PADMA-App-Link-Signing-Key
          path: padma-debug.keystore
          if-no-files-found: error
          retention-days: 90
