/* ============================================================
   31. PROFILE
   ============================================================ */
function updateAvatarDisplay(){
  const avatar = document.getElementById('avatar');
  if(!avatar) return;
  const shop = Store.data.shop;
  const menu = avatar.querySelector('#avatar-menu');
  if(shop.logo){
    avatar.innerHTML = '<img src="'+shop.logo+'" alt="Profile">' + (menu ? menu.outerHTML : '');
  } else {
    const initial = ((shop.ownerName || shop.name || 'P').charAt(0) || 'P').toUpperCase();
    avatar.innerHTML = initial + (menu ? menu.outerHTML : '');
    avatar.style.background = 'linear-gradient(135deg,var(--primary),#a78bfa)';
  }
  // Re-bind menu
  const newMenu = avatar.querySelector('#avatar-menu');
  if(newMenu){
    const profile = avatar.querySelector('#menu-profile');
    const settings = avatar.querySelector('#menu-settings');
    const logout = avatar.querySelector('#menu-logout');
    if(profile) profile.onclick = function(){ newMenu.classList.remove('open'); navigate('shop'); };
    if(settings) settings.onclick = function(){ newMenu.classList.remove('open'); navigate('settings'); };
    if(logout) logout.onclick = function(){ newMenu.classList.remove('open'); askConfirm('Logout from this device?', function(){ Auth.logout(); }); };
  }
}

function refreshBranding(){
  updateAvatarDisplay();
  const brandImg = document.getElementById('brand-img');
  const brandMark = document.getElementById('brand-mark');
  const brandTextB = document.querySelector('.brand-text b');
  const foot = document.getElementById('sidebar-foot');
  if(brandTextB && Store.data.shop.name) brandTextB.textContent = Store.data.shop.name.length > 16 ? Store.data.shop.name.slice(0,16)+'…' : Store.data.shop.name.toUpperCase();
  if(foot && Store.data.shop.shopId) foot.textContent = 'Shop '+Store.data.shop.shopId+' · Cloud';
  if(brandImg && Store.data.shop.logo){
    brandImg.src = Store.data.shop.logo;
    brandImg.style.display = 'block';
    if(brandMark) brandMark.style.display = 'none';
  }
}

function openProfileModal(){
  const shop = Store.data.shop;
  const initial = (shop.ownerName||shop.name||'P').charAt(0).toUpperCase();
  const avatarDisplay = shop.logo
    ? '<img src="'+shop.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
    : initial;
  const body =
    '<div style="text-align:center;padding:8px 0 20px">'+
      '<div id="profile-preview" style="width:120px;height:120px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:40px;margin:0 auto 14px;border:3px solid var(--border)">'+avatarDisplay+'</div>'+
      '<input type="file" id="profile-upload" accept="image/png,image/jpeg,image/webp" style="display:none">'+
      '<button type="button" class="btn btn-ghost btn-sm" id="profile-upload-btn">'+icon('upload')+' Upload Photo</button>'+
      '<p style="color:var(--text-3);font-size:11px;margin-top:10px">Max 1 MB · JPG, PNG or WEBP · auto-resized to 512×512</p>'+
    '</div>'+
    '<div class="form-grid">'+
      field('Display Name', input('displayName', shop.ownerName||'', 'text'))+
      field('Shop Name', input('shopName', shop.name||'', 'text'))+
    '</div>';
  openModal({
    title:'My Profile', body:body, size:'md', saveText:'Save Profile',
    onSave: function(data){
      const patch = {};
      if(data.displayName) patch.ownerName = data.displayName;
      if(data.shopName) patch.name = data.shopName;
      return API.updateSettings(patch, {}).then(function(res){
        Store.data.shop = Object.assign(Store.data.shop, res.shop);
        refreshBranding();
        renderNav();
        toast('Profile saved');
      }).catch(function(e){ toast('Save failed: '+e.message,'error'); });
    }
  });
  setTimeout(function(){
    const fileInput = document.getElementById('profile-upload');
    const uploadBtn = document.getElementById('profile-upload-btn');
    const preview = document.getElementById('profile-preview');
    if(uploadBtn && fileInput){ uploadBtn.onclick = function(){ fileInput.click(); }; }
    if(fileInput){
      fileInput.onchange = function(e){
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 1048576){ toast('File larger than 1 MB','error'); return; }
        if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ toast('Only JPG, PNG or WEBP','error'); return; }
        API.upload(file, 'logo').then(function(res){
          Store.data.shop.logo = res.url;
          if(preview) preview.innerHTML = '<img src="'+res.url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
          refreshBranding();
          toast('Photo updated');
        }).catch(function(e){ toast('Upload failed: '+e.message,'error'); });
      };
    }

}

function runOnboarding(){

  const body = '<p style="color:var(--text-2);margin-bottom:16px">Let\'s set up your shop preferences.</p>'+
    '<div class="form-grid">'+
      field('Shop Name', input('shopName',Store.data.shop.name||'Padma Store','text','required'),{req:true,full:true})+

    title:'Welcome to PADMA RMS', body:body, size:'md', saveText:'Get Started',
    onSave: function(data){

        name: data.shopName||Store.data.shop.name,
        ownerName: data.ownerName||Store.data.shop.ownerName,

        refreshBranding();
        toast('Welcome to PADMA RMS!');
        setTimeout(function(){ navigate('dashboard'); }, 100);
      }).catch(function(e){ toast('Save failed: '+e.message,'error'); });
    }
  });
}

/* ============================================================
   33. TOPBAR
   ============================================================ */
function setupTopbar(){
  const themeToggle = document.getElementById('theme-toggle');
  const notifBtn = document.getElementById('notif-btn');
  const quickAdd = document.getElementById('quick-add-btn');
  const hamburger = document.getElementById('hamburger');
  const avatar = document.getElementById('avatar');
  const searchInput = document.getElementById('global-search');
  const syncBtn = document.getElementById('sync-btn');

  function updateThemeIcon(){ if(themeToggle) themeToggle.innerHTML = Store.data.settings.theme==='dark'?icon('sun'):icon('moon'); }
  updateThemeIcon();
  if(themeToggle) themeToggle.onclick = function(){
    const next = Store.data.settings.theme==='dark'?'light':'dark';
    Store.data.settings.theme = next;
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('padma_theme', next); } catch(e){}
    updateThemeIcon();
    API.updateSettings({}, {theme: next}).catch(function(){});
    if(App.route==='settings') renderRoute();
  };

  if(syncBtn) syncBtn.innerHTML = icon('refresh');
  if(syncBtn) syncBtn.onclick = function(){ syncNow(true); };

  if(notifBtn) notifBtn.innerHTML = icon('bell');
  if(notifBtn) notifBtn.onclick = function(){
    const low = Calc.lowStock();
    const overdue = Store.data.tasks.filter(function(t){ return t.status!=='Completed' && t.dueDate && t.dueDate<todayISO(); });
    let html = '';
    low.slice(0,5).forEach(function(p){ html += '<div class="activity-item"><div class="ai-icon" style="background:var(--warning-soft);color:var(--warning)">'+icon('alert',14)+'</div><div class="ai-body"><b>'+esc(p.name)+'</b><small>Low stock — '+(p.stock||0)+' units</small></div></div>'; });
    overdue.slice(0,5).forEach(function(t){ html += '<div class="activity-item"><div class="ai-icon" style="background:var(--danger-soft);color:var(--danger)">'+icon('clock',14)+'</div><div class="ai-body"><b>'+esc(t.title)+'</b><small>Overdue</small></div></div>'; });
    if(!html) html = '<div class="empty-state" style="padding:30px">'+icon('checkcircle')+'<p>All clear!</p></div>';
    openModal({title:'Notifications', body:'<div class="activity-list">'+html+'</div>'});
  };

  if(quickAdd) quickAdd.innerHTML = icon('plus');
  if(quickAdd) quickAdd.onclick = function(){
    const body = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="pos">'+icon('cart')+' New Sale</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="prod">'+icon('package')+' Add Product</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="cust">'+icon('users')+' Add Customer</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="exp">'+icon('dollar')+' Add Expense</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="pur">'+icon('bag')+' New Purchase</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="task">'+icon('listtodo')+' New Task</button>'+
    '</div>';
    openModal({title:'Quick Add', body:body});
    $$('[data-q]').forEach(function(b){
      b.onclick = function(){
        const q = b.dataset.q; closeModal();
        if(q==='pos') navigate('pos');
        else if(q==='prod') openProductModal();
        else if(q==='cust') openCustomerModal();
        else if(q==='exp') navigate('expenses');
        else if(q==='pur') navigate('purchases');
        else if(q==='task') navigate('tasks');
      };
    });
  };

  if(hamburger) hamburger.innerHTML = icon('menu');
  if(hamburger) hamburger.onclick = function(){ document.getElementById('sidebar').classList.toggle('open'); };

  if(avatar) avatar.onclick = function(e){
    if (e.target.closest('#avatar-menu')) return;
    const menu = document.getElementById('avatar-menu');
    if(menu) menu.classList.toggle('open');
    e.stopPropagation();
  };
  document.addEventListener('click', function(e){
    if (!e.target.closest('#avatar')) {
      const menu = document.getElementById('avatar-menu');
      if (menu) menu.classList.remove('open');
    }
  });

  // Simple tap on avatar → profile (but not when menu is opening)
  if(avatar){
    let tapTimer = null;
    avatar.addEventListener('click', function(e){
      if (e.target.closest('#avatar-menu')) return;
      if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
        openProfileModal();
      } else {
        tapTimer = setTimeout(function(){
          tapTimer = null;
          // single tap — leave menu open
        }, 300);
      }
    });
  }

  let searchTimer;
  if(searchInput) searchInput.oninput = function(e){
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if(!q) return;
    searchTimer = setTimeout(function(){
      const ql = q.toLowerCase();
      const prods = Store.data.products.filter(function(p){ return (p.name||'').toLowerCase().indexOf(ql)>-1; });
      const custs = Store.data.customers.filter(function(c){ return (c.name||'').toLowerCase().indexOf(ql)>-1; });
      if(prods.length){ App.productFilter.q = q; navigate('products'); }
      else if(custs.length){ navigate('customers'); }
      if(searchInput) searchInput.value='';
    }, 500);
  };

  updateAvatarDisplay();
}

/* ============================================================
   34. SYNC + BOOT
   ============================================================ */
let __lastSync = null;
function syncNow(showToast){
  if (!API.token) return;
  const since = __lastSync || Store.data.serverTime || null;
  API.syncChanges(since).then(function(res){
    if (res.changed && res.bootstrap){
      Store.setFromBootstrap(res.bootstrap);
      __lastSync = res.serverTime || nowISO();
      if (App.route !== 'pos') renderRoute();
      else if (document.getElementById('pos-grid')) renderRoute();
      updateAvatarDisplay();
      if (showToast) toast('Synced');
    } else {
      __lastSync = res.serverTime || nowISO();
      if (showToast) toast('Up to date','info');
    }
  }).catch(function(e){
    if (e.message.indexOf('Session expired') === -1 && showToast) toast('Sync failed: '+e.message, 'error');
  });
}
window.syncNow = syncNow;

function startSync(){
  if (window.__padma_sync_timer) clearInterval(window.__padma_sync_timer);
  window.__padma_sync_timer = setInterval(function(){ syncNow(false); }, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) syncNow(false); });
}

async function bootApp(){
  const boot = await API.bootstrap();
  Store.setFromBootstrap(boot);
  __lastSync = boot.serverTime || nowISO();

  let theme = (Store.data.settings && Store.data.settings.theme) || 'light';
  try { const saved = localStorage.getItem('padma_theme'); if(saved) theme = saved; } catch(e){}
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('padma_theme', theme); } catch(e){}

  Auth.hideOverlay();
  const tt = document.getElementById('theme-toggle');
  if(tt) tt.innerHTML = theme==='dark'?icon('sun'):icon('moon');
  renderNav();
  setupTopbar();
  refreshBranding();
  navigate('dashboard');
  startSync();
  if(typeof needsOnboarding === 'function' && needsOnboarding()){
    setTimeout(function(){ try { runOnboarding(); } catch(e){ console.error(e); } }, 400);
  }
}
window.bootApp = bootApp;

function init(){
  if (!document.getElementById('auth-overlay')) {
    console.error('Auth overlay missing in DOM');
  }
  Auth.init();
  API.loadToken();
  try {
    const saved = localStorage.getItem('padma_theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch(e){}
  if (!API.token){
    Auth.showOverlay();
    return;
  }
  bootApp().catch(function(e){
    console.error('Boot failed:', e);
    API.clearToken();
    Auth.showOverlay();
  });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    const root = document.getElementById('modal-root');
    if (root && root.children.length > 0) closeModal();
  }
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.navigate = navigate;
window.closeModal = closeModal;
window.toast = toast;
window.openProductModal = openProductModal;
window.openCustomerModal = openCustomerModal;
</script>
